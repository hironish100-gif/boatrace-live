name: Boatrace AI 24/7 Cloud Autonomous Persistent Monitor

on:
  schedule:
    # 毎日 日本時間 09:30 (UTC 00:30) に自動起動し、15:30まで5.5時間内部常駐ループ（PC不要で全12R完全網羅）
    - cron: '30 0 * * *'
    # 毎日 日本時間 19:30 (UTC 10:30) に自動起動し、翌日の出走表と事前予想を生成
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  cloud-live-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lightgbm numpy pandas

      - name: Run Cloud Persistent Monitor (45s Loop)
        env:
          TZ: 'Asia/Tokyo'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python cloud_daemon_loop.py
